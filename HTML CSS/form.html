<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table style="border: solid black;">
    <form action="" method="post">
        <tr>
            <td colspan="2">
            <h1>
            <label style="text-align: center;">Student registration form</label>
            </h1>
        </td>
        </tr>
        <tr>
        <td><label for="">Roll nub:</label></td>
        <td ><input type="number"></td>
        </tr>
        <tr>
        <td><label for="">Enter name:</label></td>
        <td>
            <input type="text" value="fname">
            <input type="text" value="lname">
        </td>
        </tr>
        <tr>
        <td><label for="">Enter father name:</label></td>
        <td><input type="text"></td>
        </tr>
        <tr>
            <td>
                <label for="">Date of birth</label>
            </td>
            <td>
                <input type="date" name="" id="">
            </td>
        </tr>
        <tr>
        <td><label for="">Mobile nub:</label></td>
        <td><input type="text"></td>
        </tr>
        <tr>
        <td><label for="">Enter Email:</label></td>
        <td><input type="email"></td>
        </tr>
        <tr>
        <td><label for="">password:</label></td>
        <td><input type="password"></td>
        </tr>
        <tr>
        <td>Select gender:</td>
        <td><input type="radio" name="gender" id="male">
        <label for="male">MALE</label>
        <input type="radio" name="gender" id="female">
        <label for="females">FEMALE</label>
        </td>
        </tr>
        <tr>
            <td>
                Department:
            </td>
            <td>
                <input type="checkbox" name="cse" id="">
                <label for="">cse</label>
                <input type="checkbox" name="it" id="">
                <label for="">IT</label>
                <input type="checkbox" name="mec" id="">
                <label for="">mec</label>
            </td>
        </tr>
        <tr>
            <td>course:</td>
            <td>
                <select name="" id="">
                <option value="">Default</option>
                <option value="Ce">CE</option>
                <option value="it">it</option>
                <option value="mec">mec</option>
                </select>
            </td>
        </tr>
        <td><label for="">city:</label></td>
        <td><input type="text"></td>
        </tr>
        <td><label for="">Address:</label></td>
        <td>
            <textarea name="Address" id="Address">
            </textarea>
        </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                <input type="submit" name="">
            </td>
        </tr>
    </form>
    </table>
</body>
</html>
