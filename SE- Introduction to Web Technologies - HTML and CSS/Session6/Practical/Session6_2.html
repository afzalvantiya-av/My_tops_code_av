<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart product</title>
    <style>
        .smartphone{
            border: 1px solid purple;
            margin: 20px;
            padding: 15px;
            width: 300px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .iphone{
            display: block;
            height: 250px;
            width: 250px;
            margin: auto;
        }
        .iphone16{
            display: block;
            font-size: 20px;
            margin-top: 15px;
        }
        .price{
            display: inline-block;
            background-color: rgb(237, 235, 235);
            padding: 10px;
            font-weight: bold;
            margin-top: 10px;
        }
        .price{
            display: none;
        }
    
    </style>
</head>
<body>
    <div class="smartphone">
        <img class="iphone" src="iphone16.jpg" height="300px" alt="Smartphone">

        <span class="iphone16">
            Iphone16 128GB
        </span>
        <span class="price">
            ₹79,999/-
        </span>
    </div>
</body>
</html>
