<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Poster</title>
    <style>
        .grid{
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .movies{
            position: relative;
            border-radius: 10px;
            background-color: white;   
        }
        .new{
            position: absolute;
            top: 10px;
            left: 30px;
            background-color: red;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 90px;
        }
        .spacing{
            margin: 10px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1 class="spacing">BookMyShow</h1>
    <div class="grid">
        <div class="Movies">   
            <img src="Spiderman.webp" height="300px" alt="Spiderman Brand New Day">
            <span class="new">NEW</span>
            <h2>Spiderman Brand <br>New Day</h2>
        </div>
        <div class="Movies">
            <img src="Awarapan-2.jpg" height="300px"  alt="Awarapan 2">
            <h2>Awarapan 2</h2>
        </div>
        <div class="Movies">
            <img src="Dhamaal4.jpg" height="300px"  alt="Dhamaal 4">
            <h2>Dhamaal 4</h2>
        </div>
    </div>
</body>
</html>
