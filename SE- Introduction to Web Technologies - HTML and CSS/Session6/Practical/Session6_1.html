<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato style restaurant card</title>

    <style>
        .zomato{
            border: 10px solid gray;
            border-radius: 10px;
            margin: 30px auto;
            text-align: center;
            padding: 20px;
            width: 300px;
        }
        .restaurant_name{
            margin: 0 0 15px 0;
            padding: 10px;
        }
        .cuisine{
            font-size: 20px;
            margin: 10px;
            padding: 10px;
        }
        .rating{
            border: 5px solid;
            color: grey;
            padding: 10px;
            font font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="zomato">
        <h2 class="restaurant_name">
            Dominoz Pizza
        </h2>
        <p class="cuisine">
            <b>Cuisine: </b>Pizza, Margerita
        </p>
        <p class="rating">
            ★ 4.5 | Delivery: 30-45 min
        </p>
    </div>
</body>
</html>
