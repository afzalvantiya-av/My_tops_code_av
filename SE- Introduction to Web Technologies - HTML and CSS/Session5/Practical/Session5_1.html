<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart-style product card</title>
</head>
<body>
    <header>
        <h1 style="background-color: rgb(196, 123, 236); font-size: 50px;">Iphone 16</h1><br>
        <img src="iphone16.jpg" alt="" height="200px">
    </header>
    <article>
        <h2>Iphone 16 128GB</h2>
        <section>
            <p><b>Price: </b>₹1,59,999</p>
            <p><b>Ratings: </b>★ 4.5/5</p>
        </section>
        <input type="submit" value="Add to Cart">
</body>
</html>
