<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book My show</title>
    <style>
        .movie-card{
            background-color: gray;
            color: white;
            border-radius: 10px;
            margin: auto;
            padding: 20px;
            max-width: 500px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #15080c;
            color: white;
            margin-bottom: 20px;
        }
        body.dark-mode {
            background-color: #121212;
            color: white;
        }
        body.dark-mode .movie-card {
            background-color: white;
            color: black;
        }
        body.dark-mode button {
            background-color: #f8f3f4;
            color: black
        }
    </style>
</head>
<body>
    <button onclick="toggleDarkMode()">Dark Mode</button>
    <div class="movie-card">
        <h1>Spiderman Brand new day!</h1>
        <img src="Spiderman.webp" height="200px" alt="Awarapan 2">
        <section>
            <p><b>Genre: </b> Action, Crime, Romantic
            <p><b>Language: </b>Hindi</p>
            <p><b>Duration: </b>2h 25min</p>
            <p><b>Ratings: </b>⭐8.1/10</p>
        </section>
        <h2>
            About the Movie:
        </h2>
        <p>
            A forgotten Peter Parker lives alone as a full-time Spider-Man until mounting pressure triggers a dangerous change and a powerful new enemy emerges.
        </p>
    </div>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>
</body>
</html>
