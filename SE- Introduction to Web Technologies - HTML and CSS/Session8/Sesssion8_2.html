<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        .product{
            display: flex;
            gap: 25px;
            width: 700px;
            border-radius: 5px;
            background-color: lightblue;
            margin: auto;
            padding: 15px;
        }
        .product img{
            height: 250px;
            width: 300px;
            object-fit: contain;
        }
        .Details{
            flex: 1;
            padding: 20px;
        }
        .product span{
            background-color: rgb(8, 167, 8);
            border-radius: 5px;
            color: white;
            padding: 5px;
        }
        .price{
            font-weight: bold;
            margin-top: 20px;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .Ratings{
            color: darkgreen;
        }
        .product button{
            background-color: rgb(6, 6, 245);
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px;
            border: none;
            color: white;
            font-size: 15px;
        }
        .product button:hover{
            background-color: rgb(100, 123, 171);
        }
        @media (max-width: 600px){
            .product{
                flex-direction: column;
                width: 100%;
                max-width: 350px;
                gap: 20px;
            }
            .product img{
                width: 100%;
                height: 250px;
            }
            .Details{
                padding: 10px;
            }
            .product button{
                width: 100%
            }
        }
    </style>
</head>
<body>
    <div class="product">
        <img src="iphone16.jpg" alt="Iphone16 128GB">
        <div class="Details">
            <h2>Iphone 16 128GB</h2>
            <span>4.4 ★</span>
            <p class="price">₹79,999/-</p>
            <p class="Ratings">20% off</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
