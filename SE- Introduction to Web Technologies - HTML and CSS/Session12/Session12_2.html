<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>playlist grid</title>
    <style>
        .body{
            background-color: rgb(87, 158, 210);
            color: white;
        }
        .head{
            color: white;
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
        }
        .card{
            height: 350px;
            max-width: 500px;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: rgb(15, 110, 169);
        }
        .card img{
            height: 200px;
        }
        .btn{
            margin: auto;
            border-radius: 5px;
            border: none;
            font-weight: bold;
        }
        .btn:hover{
            background-color: rgb(99, 153, 99);
        }
    </style>
</head>
<body class="body">
    <h1 class="head">Playlists</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="https://c.saavncdn.com/editorial/HindiHitSongs_20260902093325.jpg?bch=1788345211" class="card-img-top" alt="hindihitsongs">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Hindi Hit Songs</h5>
                        <p class="card-text">Relax and enjoy peaceful hindi music.</p>
                        <a href="#" class="btn btn-success"> ▶ Listen Now</a>
                    </div>
                 </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="https://c.saavncdn.com/editorial/RomanticHits2026Hindi_20260707083404.jpg?bch=1783415034" class="card-img-top" alt="Top Hits">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Romantic Hits 2026 - Hindi</h5>
                        <p class="card-text">Listen to the latest popular romantic songs.</p>
                        <a href="#" class="btn btn-success"> ▶ Listen Now</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="https://c.saavncdn.com/editorial/BestOf90sHindi_20251125041813.jpg?bch=1788244377" class="card-img-top" alt="Best of 90's">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">A. R. Rahman</h5>
                        <p class="card-text">Best tranding songs of 90's.</p>
                        <a href="#" class="btn btn-success"> ▶ Listen Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>
</html>
