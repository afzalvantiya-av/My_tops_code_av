<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Flipkart Product Showcase</title>
    <style>
        .card{
            height: 400px;
            border: 2px solid;
            border-radius: 10px;
            background-color: whitesmoke;
        }
        .card img{
            height: 200px;
        }
        .btn{
            width: 100%;

        }
        .btn:hover{
            background-color:rgb(54, 147, 165) ;
        }
        .card:hover{
            transform: scale(1.1);   
        }
    </style>
</head>
<body>
    <h2 class="text-center mt-5 mb-4 fw-bold">Featured Products</h2>
    <div class="container">
        <div class="row">
            <div class="col-6 col-md-3">
                <div class="card">
                    <img src="iphone16.jpg" class="card-img-top" alt="Smartphone">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Smartphone</h5>
                        <p class="card-text">128GB</p>
                        <p class="card-text fw-bold fs-5">₹79,999</p>
                        <a href="#" class="btn btn-warning">Buy Now</a>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card">
                    <img src="lappy.webp" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Laptop</h5>
                        <p class="card-text">1Tb SSD</p>
                        <p class="card-text fw-bold fs-5">₹94,999</p>
                        <a href="#" class="btn btn-warning">Buy Now</a>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card">
                    <img src="headphone.webp" class="card-img-top" alt="Wireless Headphones">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Wireless Headphones</h5>
                        <p class="card-text">Noise Cancellation, Bluetooth</p>
                        <p class="card-text fw-bold fs-5">₹1,499</p>
                        <a href="#" class="btn btn-warning">Buy Now</a>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card">
                    <img src="smartwatch.webp" class="card-img-top" alt="Smartwatch">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Smartwatch</h5>
                        <p class="card-text">Fitness Tracking, AMOLED Display</p>
                        <p class="card-text fw-bold fs-5">₹1,999</p>
                        <a href="#" class="btn btn-warning">Buy Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>
</html>
