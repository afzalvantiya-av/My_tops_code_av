<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Musiclinkform</title>
    <style>
      .card{
        background-color: whitesmoke;
        border-radius: 10px;
        margin: auto;
        height: 350px;
        max-width: 800px;
      }
      .card-body{
        font-weight: bold;
      }
      #url{
        width: 100%;
        border: 2px ;
      }
      #btn{
        background-color: rgb(194, 116, 116);
        color: white;
        width: 95%;
        margin-bottom: 1rem;
        margin-left: 1rem;
        border: none;
        border-radius: 6px;
        padding: 8px;
      }
      #btn:hover{
        background-color: rgba(0, 0, 0, 0.824);
        cursor: pointer;
      }
    </style>
</head>
<body>
    <h1 class="text-center text-dark mt-5 mb-4">Add Music Links</h1>
    <form>
        <div class="card">
          <div class="card-body">
            <label  class="mb-3" for="url">Spotify Profile URL</label><br>
            <input  type="url" id="url"  placeholder="https://open.spotify.com/... "  required>
            </div>
            <div class="card-body">
            <label class="mb-3" for="url">YouTube Music Profile URL</label><br>
            <input type="url" id="url"  placeholder="https://music.youtube.com/... " required>
            </div>
            <div class="card-body">
            <label class="mb-3" for="url">Apple Music Profile URL</label><br>
            <input type="url" id="url"  placeholder="https://music.apple.com/... " required>
            </div>
            <input type="submit" value="Add Music Links" id="btn">
          </div>
        </div>
    </form>

    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>
</html>
