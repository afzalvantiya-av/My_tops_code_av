<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Icons</title>
    <style>
        .container{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 500px;
            border: 2px solid gold;
            margin: 50px auto;
            padding: 20px;
        }
        .container img{
            height: 80px;
            width: 80px;
       
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./insta.jpeg" alt="Instagram">
        <img src="./whatsapp.jpeg" alt="Whatsapp">
        <img src="./fb.jpeg" alt="Facebook">
        <img src="./uber.jpeg" alt="Uber">
    </div>
</body> 
</html>
