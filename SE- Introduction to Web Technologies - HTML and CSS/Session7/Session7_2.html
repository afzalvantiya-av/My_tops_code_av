<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist</title>
    <style>
        .Playlist{
            display: flex;
            gap: 30px;
            padding: 20px;
            background-color: darkolivegreen;
        }
        .card{
            display: flex;
            align-items: center;
            width: 200px;
            height: 70px;
            padding: 10px;
            background-color: rgb(77, 126, 145);
            color: white;
            border-style: groove;
            border-radius: 8px;
        }
        .song-name{
            font-weight: bold;
            margin-bottom: 5px;
        }
        .artist{
            font-size: 14px;
            color: black;
        }
    </style>
</head>
<body>
<div class="Playlist">
    <div class="card">
        <div style="margin-left: 10px;">
            <div class="song-name">Dhurandhar-title-track</div>
            <div class="artist">Shashwat sachdev</div>
        </div>
    </div>
    <div class="card">
        <div style="margin-left: 10px;">
            <div class="song-name">Sapphire</div>
            <div class="artist">Ed sheeran</div>
        </div>    
    </div>
    <div class="card">
        <div style="margin-left: 10px;">
            <div class="song-name">Saiyaara</div>
            <div class="artist">Tanishk Baghchi</div>
        </div>    
    </div>
    <div class="card">
        <div style="margin-left: 10px;">
            <div class="song-name">Shararat</div>
            <div class="artist">Shashwat sachdev</div>
        </div>
    </div>
    <div class="card">
        <div style="margin-left: 10px;">
            <div class="song-name">lutt le gaya</div>
            <div class="artist">Shashwat sachdev</div>
        </div>    
    </div>
</div>
</body>
</html>
