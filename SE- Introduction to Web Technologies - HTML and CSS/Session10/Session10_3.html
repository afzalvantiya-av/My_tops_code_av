<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Bootstrap Carousel</title>
    <style>
      .carousel{
        max-width: 350px;
        margin: 50px auto;

      }
      .carousel-item img{
        height: 500px;
        object-fit: cover;
      }
      .carousel-caption{
        background-color: rgb(139, 101, 101);
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        color: white;
      }
      .carousel-caption h5{
        font-weight: bold;
      }
      .carousel-caption p{
        margin-bottom: 0;
      }
    </style>
</head>
<body>
    <h2 class="text-center ">BookMyShow Movies Tickets</h2>
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="Awarapan-2.jpg" class="d-block w-100" alt="Awarapan2">
          <div class="carousel-caption  d-none d-md-block">
            <h5>Love Story</h5>
            <p>Action • Crime • Romantic | ⭐8/10</p> 
          </div>
        </div>
        <div class="carousel-item">
          <img src="Spiderman.webp" height="300px" class="d-block w-100" alt="spider man brand new home">
          <div class="carousel-caption d-none d-md-block">
            <h5>Action Hero</h5>
            <p>Action • Drama • Romantic | ⭐7.8/10</p>
          </div>
        </div>
        <div class="carousel-item">
          <img src="Dhamaal4.jpg" class="d-block w-100" alt="Dhamaal 4">
          <div class="carousel-caption d-none d-md-block">
            <h5>The Adventure</h5>
            <p>Adventure • Fantasy | ⭐7.5/10</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
  </div>
    
    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>
</html>
