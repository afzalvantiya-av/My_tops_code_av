<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Bootstrap form</title>
    <style>
        .card{
            max-width: 600px;
            margin: 50px auto;
            border-radius: 10px;  
        }
        .card h2{
            text-align: center;
            color: black;
            margin: 15px ;
            font-weight: bold;
        }
        .btn{
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Restaurant Review</h2>
        <div class="card-header">
            <div class="mb-3">
            <label for="username" class="form-label">Your Name</label>
            <input type="username" class="form-control" id="username" placeholder="Enter Your Name">  
        </div>
        <label for="select" class="form-label">Ratings</label>
       <select class="form-select" aria-label="Default select example">
            <option selected disabled>Select Rating</option>
            <option value="1">⭐⭐⭐⭐⭐ - 5 Stars</option>
            <option value="2">⭐⭐⭐⭐ - 4 Stars</option>
            <option value="1">⭐⭐⭐ - 3 Stars</option>
            <option value="1">⭐⭐ - 2 Stars</option>
            <option value="3">⭐ - 1 Stars</option>
        </select>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Write Review</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" placeholder="Write your review here..." rows="5"></textarea>
        </div>
        <button type="submit" class="btn btn-danger">Submit Review</button>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>
</html>
