<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        /* Main container */
        #mainContainer {
            min-height: 100vh;
            padding: 40px;
            transition: 0.3s;
        }
        .movie-card {
            max-width: 500px;
            margin: 50px auto;
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div id="mainContainer" class="bg-light text-dark">
        <div class="container">

            <!-- Theme Button -->
            <div class="text-end">
                <button id="themeButton" class="btn btn-primary">🌙 Dark Mode</button>
            </div>

            <!-- Movie Card -->
            <div class="card movie-card shadow">
                <div class="card-body text-center">
                    <h1 class="card-title">Movie Ticket</h1>
                    <h4>Dhamaal 4</h4>
                    <p class="text-muted">Action • Adventure • Comedy</p>
                    <button class="btn btn-primary">Book Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const mainContainer = document.getElementById("mainContainer");
        const themeButton = document.getElementById("themeButton");

        themeButton.addEventListener("click", function () {

            // Toggle background classes
            mainContainer.classList.toggle("bg-light");
            mainContainer.classList.toggle("bg-dark");

            // Toggle text color classes
            mainContainer.classList.toggle("text-dark");
            mainContainer.classList.toggle("text-light");

            // Change button text
            if (mainContainer.classList.contains("bg-dark")) {
                themeButton.textContent = "☀️ Light Mode";
            } else {
                themeButton.textContent = "🌙 Dark Mode";
            }
        });
    </script>
</body>
</html>
